# UserDecorations.conf
# -----------------
# (Contents from ~/.config/hypr/UserConfigs/UserDecorations.conf)

# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
#source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 3
  gaps_in = 4
  gaps_out = 10
  
  col.active_border = 0xffA284C5
  col.inactive_border = 0xff635475
  #col.active_border = 0xfffffff
  #col.inactive_border = 0xffffff
}

decoration {
  rounding = 12
          
  #active_opacity = 1.0
  #inactive_opacity = 0.9
  #fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = false
    range = 3
    render_power = 1

    color =  0xff513277
    color_inactive = 0xff313131
  }

  blur {
    enabled = true
    size = 3
    passes = 5
    ignore_opacity = true
    new_optimizations = true
    xray = false
    vibrancy  = 0
    vibrancy_darkness = 0.38
    special = true
    popups = true
  }
}

group {
  col.border_active = 0xff59cdff

  	groupbar {
  		col.active = 0xff59cdff
  }
}

# UserDecorations end


#Animations
animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 2.5, md3_decel
    animation = workspaces, 1, 3.5, easeOutExpo, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}
# Disable Animations
#animations {
#  enabled = false
#}
