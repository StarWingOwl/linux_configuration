# UserKeybinds.conf
# -----------------
# (Contents from ~/.config/hypr/UserConfigs/UserKeybinds.conf)

# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

$mainMod = SUPER

# nwg-displays
source= $HOME/.config/hypr/monitors.conf
source= $HOME/.config/hypr/workspaces.conf
dwindle {
  force_split=2
}

# settings for User defaults apps - set your default terminal and file manager on this file


# common shortcuts

bind = $mainMod, SPACE, exec, vicinae toggle
#bind = $mainMod, SPACE, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window # Main Menu (APP Launcher)
bind = $mainMod, B, exec, brave  # default browser
bind = $mainMod, A, exec, pkill rofi || true && ags -t 'overview' # desktop overview (if installed)
#bind = $mainMod, A, global, quickshell:overviewToggle # desktop overview (if installed)
bind = $mainMod, Return, exec, kitty  #terminal
bind = $mainMod SHIFT, Return, exec, ~/.config/hypr/Dropterminal.sh kitty
bind = $mainMod, E, exec, nautilus #file manager
bind = $mainMod, M, exec, spotify-launcher
bind = $mainMod SHIFT, P, exec, torbrowser-launcher
bind = $mainMod, T, exec, signal-desktop --password-store='kwallet6'
bind = $mainMod, Escape, exec, qs -c noctalia-shell ipc call sessionMenu toggle
bind = $mainMod SHIFT, F, fullscreen # whole full screen
bind = $mainMod, F, fullscreen, 1 # fake full screen
bind = $mainMod, V, togglefloating, #Float Mode
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat #All Float Mode
# Desktop zooming or magnifier
bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

#bind = $mainMod ALT, mouse_down, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
#bind = $mainMod ALT, mouse_up, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

# Waybar / Bar related
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar 

# FEATURES / EXTRAS (UserScripts)

bind = $mainMod CTRL, O, exec, hyprctl setprop active opaque toggle # disable opacity on active window

#bind = , mouse:276, exec, ~/.local/bin/toggle-mic.sh

bind = ALT, L, exec, qs -c noctalia-shell ipc call lockScreen lock
#bind = $mainMod, F, exec, rofi -show filebrowser
bind = $mainMod SHIFT, V, exec, ~/.local/bin/togglefloat.sh
# Swap Windows
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

binde = $mainMod ALT, left, resizeactive,-50 0
binde = $mainMod ALT, right, resizeactive,50 0
binde = $mainMod ALT, up, resizeactive,0 -50
binde = $mainMod ALT, down, resizeactive,0 50

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down,movefocus, d

# UserKeybinds end

# UserSettings.conf
# -----------------
# (Contents from ~/.config/hypr/UserConfigs/UserSettings.conf)

# User Settings

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
dwindle {
  pseudotile = true
  preserve_split = true
  #smart_split = true
  special_scale_factor = 0.8
}

master {
  new_status = master
  new_on_top = 1
  mfact = 0.5
}

general {
  resize_on_border = true
      
  layout = dwindle
}

input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  repeat_rate = 35
  repeat_delay = 250
  sensitivity = -0.6 #mouse sensitivity
  accel_profile = flat    # flat or adaptive or blank or EMPTY means libinput’s default mode
  numlock_by_default = true
  left_handed = false
  follow_mouse = 1
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = true
    natural_scroll = true 
    clickfinger_behavior = false
    middle_button_emulation = false
    tap-to-click = true
    drag_lock = false
  }
  
  # below for devices with touchdevice ie. touchscreen
  	touchdevice {
    enabled = true
   }
   	
   # below is for table see link above for proper variables
   	tablet {
    	transform = 0
    	left_handed = 0
    	}
}

#gestures {
 # workspace_swipe = true
   #workspace_swipe_fingers = 3
   #workspace_swipe_distance = 500
   #workspace_swipe_invert = true
   #workspace_swipe_min_speed_to_force = 30
   #workspace_swipe_cancel_ratio = 0.5
   #workspace_swipe_create_new = true 
   #workspace_swipe_forever = true
   #workspace_swipe_use_r = true #uncomment if wanted a forever create a new workspace with swipe right
#}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = true
  vrr = 2
  mouse_move_enables_dpms = true
  enable_swallow = off
  swallow_regex = ^(kitty)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = true
  enable_anr_dialog = true    # Application not Responding (ANR)
  anr_missed_pings = 15       # ANR Threshold default 1 is too low
}

#opengl {
#  nvidia_anti_flicker = true
#}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}

render {
  direct_scanout = 0
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors = 2 # change to 1 if want to disable
  enable_hyprcursor = true
  no_warps = true
}

# UserSettings end

